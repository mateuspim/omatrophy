<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2100" height="1030" viewBox="0 0 2100 1030" role="img" aria-label="OmaTrophy's reminder and recap cards">
<!-- The README's card gallery. Render from the repository root:
     rsvg-convert -o docs/brand/captures/cards.png docs/brand/cards.svg
     Each card is cropped from a 2x dev/render.sh capture (fake data, dos-moos);
     the background is that theme's, so the crops' corners blend in. -->
<rect width="2100" height="1030" fill="#131516"/>
<!-- Left: the missable reminder over a milestone toast. -->
<svg x="60" y="60" width="960" height="583" viewBox="520 80 960 583"><image width="2000" height="1120" xlink:href="captures/missable.png"/></svg>
<svg x="120" y="793" width="840" height="177" viewBox="580 80 840 177"><image width="2000" height="520" xlink:href="captures/milestone.png"/></svg>
<!-- Right: the session recap over the difficulty reminder. -->
<svg x="1080" y="60" width="960" height="441" viewBox="520 80 960 441"><image width="2000" height="800" xlink:href="captures/recap.png"/></svg>
<svg x="1080" y="541" width="960" height="429" viewBox="520 80 960 429"><image width="2000" height="520" xlink:href="captures/difficulty.png"/></svg>
</svg>
